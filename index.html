    <!-- Instant System-First Typography (Zero External CDN Blocking) -->
    <style>
      :root {
        --qaem-font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
      }
      html,
      body {
        font-family: var(--qaem-font-family);
      }
    </style>
    <script>
      (function () {
        // Safe storage reader for restricted preview iframes & sandboxed browsers
        function safeReadStorage(key) {
          try {
            if (typeof window !== 'undefined' && window.localStorage) {
              return window.localStorage.getItem(key);
            }
          } catch (e) {}
          return null;
        }

        try {
          if (typeof window !== 'undefined') {
            if (typeof window.global === 'undefined') {
              window.global = window;
            }
            if (typeof window.process === 'undefined') {
              window.process = { env: {} };
            } else if (!window.process.env) {
              window.process.env = {};
            }
          }
          var savedTheme = safeReadStorage('qaem_theme_preference');
          var isDark = savedTheme ? savedTheme === 'dark' : true;
          document.documentElement.classList.toggle('dark', isDark);
          var savedScale = safeReadStorage('qaem_font_scale');
          var scaleMap = { compact: '90%', normal: '100%', large: '110%' };
          var rootPct = scaleMap[savedScale] || '100%';
          document.documentElement.style.setProperty('--qaem-root-font-size', rootPct);
        } catch (e) {}

        // Non-blocking progressive webfont enhancement (never blocks first paint on restricted networks)
        function loadOptionalArabicFont() {
          try {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap';
            link.crossOrigin = 'anonymous';
            link.media = 'print';
            link.onload = function () {
              link.media = 'all';
            };
            link.onerror = function () {
              // Silent fallback to instant system fonts
            };
            document.head.appendChild(link);
          } catch (e) {}
        }
        if (document.readyState === 'complete') {
          setTimeout(loadOptionalArabicFont, 0);
        } else {
          window.addEventListener('load', function () {
            setTimeout(loadOptionalArabicFont, 0);
          }, { once: true });
        }

        function renderFatalStartupError(message) {
          try {
            var root = document.getElementById('root');
            if (!root || root.childElementCount > 0) return;
            var msgStr = String(message || '');
            // Ignore harmless non-fatal resize/script/network noise while booting
            if (
              msgStr === 'Script error.' ||
              msgStr.indexOf('ResizeObserver') !== -1 ||
              msgStr.indexOf('WebSocket') !== -1
            ) {
              return;
            }
            root.innerHTML =
              '<div dir="rtl" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0B1221;color:#F8FAFC;font-family:Cairo,system-ui,-apple-system,Tahoma,Arial,sans-serif;">' +
              '<div style="max-width:560px;width:100%;background:#111827;border:1px solid rgba(245,158,11,0.45);border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,0.4);">' +
              '<h1 style="margin:0 0 8px;font-size:18px;color:#FBBF24;">تعذر تحميل بوابة قافلة القائم</h1>' +
              '<p style="margin:0 0 14px;font-size:13px;color:#CBD5E1;line-height:1.7;">حدث خطأ أثناء تحميل ملفات التطبيق. يرجى إعادة المحاولة أو تحديث الصفحة.</p>' +
              '<pre dir="ltr" style="margin:0 0 16px;padding:12px;background:#030712;border:1px solid rgba(244,63,94,0.35);border-radius:12px;color:#FDA4AF;font-size:12px;white-space:pre-wrap;word-break:break-word;">' +
              String(message || 'Unknown startup error').replace(/[<>&]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]; }) +
              '</pre>' +
              '<button onclick="location.reload()" style="background:#F59E0B;color:#0F172A;border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:13px;cursor:pointer;">إعادة المحاولة</button>' +
              '</div></div>';
          } catch (e) {}
        }

        window.addEventListener('error', function (ev) {
          if (ev && ev.message) renderFatalStartupError(ev.message);
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var reason = ev && ev.reason;
          var msg = reason && reason.message ? reason.message : String(reason || '');
          if (msg) renderFatalStartupError(msg);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
